title: Site

tabs:
  content:
    label: Content
    sections:
      pages:
        type: pages
        sortable: true

  header:
    label: Header
    fields:
      ctaHeadline:
        type: headline
        label: Call to action

      ctaIcon:
        label: Icon
        type: icon
        folder: assets/icons
        max: 1

      ctaLabel:
        label: Label
        type: text

      ctaUrl:
        label: URL
        type: url

  companyInfo:
    label: Company information
    fields:
      companyHeadline:
        type: headline
        label: Company information

      logo:
        label: Site logo
        type: files
        multiple: false
        query: site.images
        help: Shown in the header in place of the site title, if set.

      companyName:
        label: Company name
        type: text

      companyAddress:
        label: Address
        type: textarea
        size: small

      companyPhone:
        label: Phone
        type: text

      email:
        label: Email
        type: email

      legalHeadline:
        type: headline
        label: Legal pages

      privacyPage:
        label: Privacy policy page
        type: pages
        multiple: false

      cookiePage:
        label: Cookie policy page
        type: pages
        multiple: false

      socialHeadline:
        type: headline
        label: Social links

      social:
        label: Social links
        type: structure
        fields:
          icon:
            label: Icon
            type: icon
            folder: assets/icons
            max: 1
          label:
            label: Label
            type: text
            required: true
          url:
            label: URL
            type: url
            required: true
        columns:
          icon:
            width: 1/6
          label:
            width: 2/6
          url:
            width: 3/6
